<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xhi - Polychora Series | 3D Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading-text">Loading 3D Model...</div>
    <p>Polychora Viewer</p>
    <model-viewer 
        src="https://arweave.net/-44mTBYb7EBuBaBjX9SONF4e3QHlzrWy3Od8eWXxkbo"
        alt="Xhi - Digital sculpture from Polychora Series by Pardesco"
        auto-rotate
        camera-controls
        shadow-intensity="1"
        loading="eager"
        reveal="auto"
        auto-rotate-delay="0"
        rotation-per-second="30deg"
        field-of-view="30deg"
        min-camera-orbit="auto auto 5%"
        max-camera-orbit="auto auto 100%">
    </model-viewer>
    
    <div class="controls">
        Drag to rotate • Scroll to zoom • Double-tap to reset
    </div>
    
    <script>
        // Hide loading text when model loads
        document.addEventListener('DOMContentLoaded', function() {
            const modelViewer = document.querySelector('model-viewer');
            modelViewer.addEventListener('load', function() {
                document.getElementById('loading-text').style.display = 'none';
            });
        });
    </script>
</body>
</html>
